name: CI

# Documentation-only changes (plans, state records, tickets, notes) do not run
# the suites: no test reads these paths, and each run costs ~20 Actions minutes
# of the free tier. A push or PR that also touches any other file still runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.scratch/**'
      - '.k-session/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.scratch/**'
      - '.k-session/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        run: |
          cd backend
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Run typecheck
        run: |
          cd frontend
          npm run typecheck
      - name: Run frontend tests
        run: |
          cd frontend
          npm run test -- --ci
      - name: Run frontend build
        run: |
          cd frontend
          npm run build
