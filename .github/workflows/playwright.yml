name: Playwright Tests

# Documentation-only changes (plans, state records, tickets, notes) do not run
# the suites: no test reads these paths, and each run costs ~20 Actions minutes
# of the free tier. A push or PR that also touches any other file still runs.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.scratch/**'
      - '.k-session/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.scratch/**'
      - '.k-session/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run smoke tests
        run: npx playwright test --project=chromium --grep @smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ./frontend/playwright-report/
