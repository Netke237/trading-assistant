name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # no cache: 'npm' — that requires cache-dependency-path to point at a
          # committed lockfile, and frontend/package-lock.json is gitignored repo-wide

      - name: Install dependencies
        run: npm install   # not npm ci — same reason, no committed lockfile to install from

      - name: Run typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run smoke tests
        run: npx playwright test --project=chromium --grep @smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ./frontend/playwright-report/
