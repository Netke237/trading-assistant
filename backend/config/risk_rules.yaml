# backend/config/risk_rules.yaml

portfolio:
  max_total_exposure_pct: 0.25
  max_concurrent_positions: 10
  max_daily_recommendations: 5
  max_same_symbol_positions: 1
  min_portfolio_value: 5000.0
  portfolio_value: 100000.0
  max_single_position_pct: 0.05

sizing:
  max_contracts_per_trade: 5

# Reward-risk calculation defaults (FR-45)
reward_risk:
  bullish_target_pct: 0.08      # +8% stock move for T1 target
  bearish_target_pct: 0.08      # 8% move down for bearish T1
  bullish_invalidation_pct: 0.03   # -3% stock = invalidation
  bearish_invalidation_pct: 0.03   # +3% stock = bearish invalidation
  premium_stop_pct: 0.60        # stop out if option loses 60% of premium
  target_t1_pct: 0.20           # profit-target ladder for the first-passage estimate (% of premium)
  target_t2_pct: 0.35
  target_t3_pct: 0.50

# Monte Carlo first-passage-time simulation tunables (profit-target estimator)
first_passage:
  max_drift_pct: 0.40    # annualized drift ceiling at a trend score of 100 (0 at score 50, -max at score 0)
  n_paths: 2000          # simulated GBM paths per estimate
  sigma_floor: 0.10      # annualized stock volatility floor (guards against degenerate ATR data)
  sigma_ceiling: 1.50    # annualized stock volatility ceiling

auto_trade:
  max_arm_age_minutes: 30   # disarm without firing if order was armed longer than this
  max_daily_loss_pct: 0.02     # 2% of portfolio_value = $2,000 on $100k
  premium_stop_pct: 0.60       # matches reward_risk.premium_stop_pct default
  regime_monitor_interval_minutes: 15
  regime_flip_sustain_minutes: 0   # 0 = warn on the first REJECT+open-positions tick (original behavior)
  # INTENTIONAL DEAD CONFIG (not a bug): gap_threshold_pct is reserved for a future
  # percentage buffer around the stop-loss trigger. No code currently reads this key —
  # auto_trader.py alerts on any stop breach with no buffer. Verified zero read sites as
  # of Phase D config audit (2026-07-01). Leave in place; do not remove without adding the
  # feature that consumes it.
  gap_threshold_pct: 0.05
