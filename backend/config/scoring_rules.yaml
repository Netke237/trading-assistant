# backend/config/scoring_rules.yaml

score_thresholds:
  pass: 55
  caution: 35

confidence_gate:
  enabled: true
  cautionBelow: 50   # confidence < 50 -> cap final status at CAUTION
  rejectBelow: 35    # confidence < 35 -> cap final status at REJECT

confidence_backtest:
  swing:
    n_days: 10
    atr_mult: 1.5
    atr_period: 14
    history_years: 4
    min_samples: 20
  position:
    n_days: 40
    atr_mult: 1.5
    atr_period: 14
    history_years: 5
    min_samples: 20
  intraday:
    n_days: 5
    atr_mult: 1.5
    atr_period: 14
    history_years: 2
    min_samples: 20

horizons:
  swing:
    weights:
      trend: 0.30
      pullback: 0.20
      trigger: 0.25
      event: 0.15
      vol: 0.10
    trend:
      method: additive          # crossover | additive | relative_strength
      crossover:
        fast_ema: 50
        slow_ema: 200
        slow_slope_required: true
        fast_slope_required: false
      additive:
        ma_period: 20
        ma_type: SMA
        slope_lookback: 10
        adx_period: 14
        adx_pass: 25
        adx_caution: 20
        price_max: 40
        slope_max: 30
        adx_max: 30
      relative_strength:
        rs_period: 20
        rs_pass_threshold: 2.0
        rs_caution_threshold: -1.0
        benchmark: NDX
    pullback:
      fib_shallow_min: 0.236
      fib_shallow_max: 0.382
      fib_standard_min: 0.382
      fib_standard_max: 0.500
      fib_golden_min: 0.500
      fib_golden_max: 0.618
      swing_high_lookback_bars: 40
      swing_high_min_bars_ago: 5
      max_days_in_pullback: 20
      theta_caution_days: 15
      atr_period: 14
      atr_pass_min: 1.0
      atr_pass_max: 2.0
      atr_caution_max: 2.5
    trigger:
      macd_fast: 8
      macd_slow: 21
      macd_signal: 5
      macd_histogram_rising: true
      rsi_period: 14
      rsi_floor: 44
      rsi_div_window_bars: 15
      stoch_k: 14
      stoch_d: 3
      stoch_smooth: 3
      stoch_oversold: 30
      stoch_tolerance_pct: 5
      setup_window_bars: 8
      momentum_signals_for_pass: 2
      volume_lookback_bars: 20
      volume_multiplier: 1.50
      volume_bonus_pts: 10
    event:
      reject_days: 7
      caution_days: 21
    vol:
      iv_rank_compressed_caution: 5
      iv_rank_pass_max: null
      iv_rank_caution_max: 55

  intraday:
    weights:
      trend: 0.35
      pullback: 0.20
      trigger: 0.30
      event: 0.05
      vol: 0.10
    trend:
      method: additive
      crossover:
        fast_ema: 20
        slow_ema: 50
        slow_slope_required: true
        fast_slope_required: false
      additive:
        ma_period: 9
        ma_type: EMA
        slope_lookback: 3
        adx_period: 7
        adx_pass: 20
        adx_caution: 15
        price_max: 40
        slope_max: 30
        adx_max: 30
      relative_strength:
        rs_period: 2
        rs_pass_threshold: 1.0
        rs_caution_threshold: -0.5
        benchmark: NDX
    pullback:
      fib_shallow_min: 0.236
      fib_shallow_max: 0.382
      fib_standard_min: 0.382
      fib_standard_max: 0.500
      fib_golden_min: 0.500
      fib_golden_max: 0.618
      swing_high_lookback_bars: 20
      swing_high_min_bars_ago: 5
      max_days_in_pullback: 3
      theta_caution_days: 2
      atr_period: 14
      atr_pass_min: 1.0
      atr_pass_max: 2.0
      atr_caution_max: 2.5
    trigger:
      macd_fast: 5
      macd_slow: 13
      macd_signal: 3
      macd_histogram_rising: true
      rsi_period: 14
      rsi_floor: 44
      rsi_div_window_bars: 10
      stoch_k: 14
      stoch_d: 3
      stoch_smooth: 3
      stoch_oversold: 30
      stoch_tolerance_pct: 5
      setup_window_bars: 10
      momentum_signals_for_pass: 1
      volume_lookback_bars: 20
      volume_multiplier: 1.20
      volume_bonus_pts: 10
    event:
      reject_days: 1
      caution_days: 3
    vol:
      iv_rank_compressed_caution: null
      iv_rank_pass_max: null
      iv_rank_caution_max: null

  position:
    weights:
      trend: 0.30
      pullback: 0.20
      trigger: 0.20
      event: 0.20
      vol: 0.10
    trend:
      method: additive
      crossover:
        fast_ema: 50
        slow_ema: 200
        slow_slope_required: true
        fast_slope_required: true
      additive:
        ma_period: 50
        ma_type: SMA
        slope_lookback: 20
        adx_period: 14
        adx_pass: 25
        adx_caution: 15
        price_max: 40
        slope_max: 30
        adx_max: 30
      relative_strength:
        rs_period: 50
        rs_pass_threshold: 3.0
        rs_caution_threshold: -1.5
        benchmark: SPX
    pullback:
      fib_shallow_min: 0.236
      fib_shallow_max: 0.382
      fib_standard_min: 0.382
      fib_standard_max: 0.500
      fib_golden_min: 0.500
      fib_golden_max: 0.618
      swing_high_lookback_bars: 75
      swing_high_min_bars_ago: 3
      max_days_in_pullback: 60
      theta_caution_days: 45
      atr_period: 14
      atr_pass_min: 1.0
      atr_pass_max: 2.0
      atr_caution_max: 2.5
    trigger:
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      macd_histogram_rising: true
      rsi_period: 14
      rsi_floor: 37
      rsi_div_window_bars: 20
      stoch_k: 14
      stoch_d: 3
      stoch_smooth: 3
      stoch_oversold: 30
      stoch_tolerance_pct: 5
      setup_window_bars: 5
      momentum_signals_for_pass: 2
      volume_lookback_bars: 20
      volume_multiplier: 1.50
      volume_bonus_pts: 10
    event:
      reject_days: 30
      caution_days: 60
    vol:
      iv_rank_compressed_caution: 5
      iv_rank_pass_max: null
      iv_rank_caution_max: 65

# Entry quality thresholds (FR-45)
entry_quality:
  spread_tolerance_pct: 0.10
  max_slippage_pct: 0.03
  min_premium: 0.10

regime:
  intraday: { timeframe: 15min, lookback: 26, window: 1000, min_obs: 60 }
  swing:    { timeframe: daily, lookback: 20, window: 500,  min_obs: 100 }
  position: { timeframe: daily, lookback: 50, window: 750,  min_obs: 100 }
  enhanced_states: false

regime_gate:
  enabled: true
  headwind_caution_pct: -15
  headwind_reject_pct:  -40
  require_stable_for_reject: true

regime_sizing:
  enabled: false
  min_mult: 0.5
  full_conviction_pct: 40

fundamentals_gate:
  enabled: true
  cautionBelow: 45   # bullish: demote weak fundamentals
  rejectBelow: 30    # bullish
  cautionAbove: 70   # bearish: caution shorting strong companies
  rejectAbove: 80    # bearish: reject shorting very strong companies
  safety:
    reject_on_negative_equity: true
    debt_to_equity_reject: 3.0
  staleness_days: 90
  weights: { growth: 0.35, quality: 0.35, risk: 0.30 }
  thresholds:
    revenue_growth_yoy:  { strong: 0.15, weak: 0.0 }
    eps_growth_yoy:      { strong: 0.15, weak: 0.0 }
    gross_margin:        { strong: 0.40, weak: 0.20 }
    operating_margin:    { strong: 0.15, weak: 0.0 }
    debt_to_equity:      { strong: 0.5,  weak: 2.0 }
    current_ratio:       { strong: 2.0,  weak: 1.0 }
    share_growth_yoy:    { strong: 0.0,  weak: 0.03 }
