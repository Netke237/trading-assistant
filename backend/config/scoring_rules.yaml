      atr_period: 14
      atr_pass_min: 1.0
      atr_pass_max: 2.0
      atr_caution_max: 2.5
    trigger:
      macd_fast: 8
      macd_slow: 21
      macd_signal: 5
      macd_histogram_rising: true
      rsi_period: 14
      rsi_floor: 44
      rsi_div_window_bars: 15
      stoch_k: 14
      stoch_d: 3
      stoch_smooth: 3
      stoch_oversold: 30
      stoch_tolerance_pct: 5
      setup_window_bars: 8
