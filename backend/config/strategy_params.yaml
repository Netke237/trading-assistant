# NOTE (2026-08-22, stock exit-targets rework): every `active:` value below was
# selected by the WFO tuner under the PREVIOUS exit formula, where target_price
# was a uniform `entry +/- risk * rr_target_mult` (or a fixed ATR multiple) for
# six of seven strategies. Targets are now strategy-specific (measured move,
# mid-band, prior swing extreme, VWAP, short-term mean), so `strategy_backtest`
# measures a different `tp=` and these values are no longer the tuner's answer to
# the current question. RE-RUNNING THE TUNER (Settings -> Strategy Tuning) IS AN
# EXPECTED, INTENDED CONSEQUENCE of that rework, not a symptom of a problem.
# Historical win rates and expectancies shown in step-6-backtest will also move
# (win rate up, average win down) for the same reason.
#
# Caveat: strategy_param_store.adopt() rewrites this file with yaml.safe_dump,
# which destroys every comment in it — including this one. The durable record is
# get_exit()'s docstring and
# docs/superpowers/plans/2026-08-22-stock-exit-targets-plan.md.

windows:
  type: rolling
  train_months: 12
  test_months: 3

costs:
  fee_pct: 0.001
  slippage_pct: 0.001

# bullish | bearish — controls which direction the backtest uses during WFO
direction: bullish

# Auto-evict finished jobs; keep the most recent max_completed (completed + failed)
job_retention:
  max_completed: 100

# Eligibility thresholds for WFO proposals
optimization:
  min_trades: 20
  min_consistency: 0.5

basket:
  per_sector: 5
  symbols: []

strategies:
  pullback_ema:
    active:
      bullish:
        ema_period: 50
        trend_ema: 100
        atr_stop_mult: 1.5
        rr_target_mult: 2.0          # rungs 2-3 only; also in exit: so adopt() can't drop it
        tolerance: 0.04
        exit_swing_lookback: 20
      bearish:
        ema_period: 35
        trend_ema: 100
        atr_stop_mult: 1.5
        rr_target_mult: 2.0
        tolerance: 0.04
        exit_swing_lookback: 20
    exit:
      exit_swing_lookback: 20
      rr_target_mult: 2.0
    search:
      # 35 is included alongside the original [20, 50] grid because
      # active.bearish.ema_period is deliberately hand-tuned to 35 — this
      # widening lets the WFO optimizer validate that live value against the
      # rest of the grid instead of it silently sitting outside search space.
      # See PLAN_TIER1_RISK_SAFETY.md #3.
      ema_period: [20, 35, 50]
      trend_ema: [100, 150, 200]
      atr_stop_mult: [1.0, 1.5, 2.0]
      # rr_target_mult REMOVED from the grid: it no longer influences
      # target_price (= ladder[0], now the prior swing extreme), and
      # strategy_backtest can only observe ladder[0]. Tuning it here would let
      # consensus() write a median of pure noise into active:.
      exit_swing_lookback: [10, 20, 30]
      tolerance: [0.02, 0.04, 0.06, 0.08]

  breakout_base:
    active:
      bullish:
        base_lookback: 20
        atr_tight_max: 4.0
        volume_mult: 1.5
        rr_target_mult: 2.0          # degenerate-case fallback only
        measured_move_mult: 1.0
      bearish:
        base_lookback: 20
        atr_tight_max: 4.0
        volume_mult: 1.5
        rr_target_mult: 2.0
        measured_move_mult: 1.0
    exit:
      measured_move_mult: 1.0
      rr_target_mult: 2.0
    search:
      base_lookback: [15, 20, 30]
      atr_tight_max: [3.0, 3.5, 4.0, 4.5]
      volume_mult: [1.1, 1.3, 1.5]
      # rr_target_mult REMOVED (see pullback_ema); replaced by the parameter
      # that actually sets rung 1. Same combo count as before.
      measured_move_mult: [0.75, 1.0, 1.25, 1.5]

  ma_crossover:
    active:
      bullish:
        fast: 20
        slow: 50
        lookback: 10
        atr_target_mult: 3.0
      bearish:
        fast: 20
        slow: 50
        lookback: 10
        atr_target_mult: 3.0
    exit:
      atr_target_mult: 3.0
    search:
      fast: [10, 20]
      slow: [50, 100]
      lookback: [5, 10]
      # Newly tunable: this multiple was hardcoded at 3.0 in the signal function
      # and does set rung 1, so the tuner can now see it.
      atr_target_mult: [2.0, 3.0, 4.0]

  mean_reversion_rsi:
    active:
      bullish:
        rsi_period: 14
        rsi_oversold: 30
        trend_sma: 200
        require_choppy_regime: false
        exit_sma_period: 20
        atr_target_mult: 2.5         # scales rung 2 only — not in the grid
      bearish:
        rsi_period: 14
        rsi_oversold: 30
        trend_sma: 200
        require_choppy_regime: false
        exit_sma_period: 20
        atr_target_mult: 2.5
    exit:
      exit_sma_period: 20
      atr_target_mult: 2.5
    search:
      rsi_period: [7, 14]
      rsi_oversold: [25, 30, 35]
      trend_sma: [100, 200]
      exit_sma_period: [10, 20]      # sets rung 1

  mean_reversion_bb:
    active:
      bullish:
        bb_period: 20
        bb_std: 2.0
        trend_sma: 200
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        require_choppy_regime: false
      bearish:
        bb_period: 20
        bb_std: 2.0
        trend_sma: 200
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        require_choppy_regime: false
    exit:
      rr_target_mult: 2.0
    search:
      bb_period: [15, 20, 25]
      bb_std: [1.5, 2.0, 2.5]
      trend_sma: [100, 200]
      stop_atr_mult: [0.2, 0.5, 1.0]
      # rr_target_mult REMOVED with NO replacement: rung 1 is the mid-band,
      # already fully determined by bb_period/bb_std, which are in the grid
      # above and now genuinely drive the exit as well as the entry.

  mean_reversion_vwap:
    active:
      bullish:
        vwap_dev_pct: 1.5
        reversal_pct: 0.3
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        interval: '15m'
        vwap_extension_atr: 0.5
      bearish:
        vwap_dev_pct: 1.5
        reversal_pct: 0.3
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        interval: '15m'
        vwap_extension_atr: 0.5
    exit:
      vwap_extension_atr: 0.5
      rr_target_mult: 2.0
    # no search block — excluded from WFO optimizer (intraday-only; no session boundary in daily OHLCV)

  mean_reversion_vwap_daily:
    # No active:/search: — this variant is only reachable through
    # mean_reversion_multi, which supplies vwap_lookback/vwap_deviation_pct from
    # the request. It gets an exit: block so its ladder is configurable.
    exit:
      rr_target_mult: 2.0

  breakout_setup:
    active:
      bullish:
        atr_compression_ratio: 0.85
        atr_avg_lookback: 20
        range_atr_mult: 3.0
        range_lookback_bars: 10
        vol_compression_ratio: 0.9
        resistance_proximity_pct: 0.08
        swing_lookback: 50
        require_trend: true
      bearish:
        atr_compression_ratio: 0.85
        atr_avg_lookback: 20
        range_atr_mult: 3.0
        range_lookback_bars: 10
        vol_compression_ratio: 0.9
        resistance_proximity_pct: 0.08
        swing_lookback: 50
        require_trend: true
    # no search block — SetupSignal has no entry/stop/target; cannot be backtested

composite_trigger:
  conviction_min: 60
  p_transition_min: 0.35
  p_stay_min: 0.70
  min_confirmations: 1
