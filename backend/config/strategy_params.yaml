windows:
  type: rolling
  train_months: 12
  test_months: 3

costs:
  fee_pct: 0.001
  slippage_pct: 0.001

# bullish | bearish — controls which direction the backtest uses during WFO
direction: bullish

# Auto-evict finished jobs; keep the most recent max_completed (completed + failed)
job_retention:
  max_completed: 100

# Eligibility thresholds for WFO proposals
optimization:
  min_trades: 20
  min_consistency: 0.5

basket:
  per_sector: 5
  symbols: []

strategies:
  pullback_ema:
    active:
      bullish:
        ema_period: 50
        trend_ema: 100
        atr_stop_mult: 1.5
        rr_target_mult: 2.0
        tolerance: 0.08
      bearish:
        ema_period: 35
        trend_ema: 100
        atr_stop_mult: 1.5
        rr_target_mult: 2.0
        tolerance: 0.08
    search:
      ema_period: [20, 50]
      trend_ema: [100, 150, 200]
      atr_stop_mult: [1.0, 1.5, 2.0]
      rr_target_mult: [1.5, 2.0, 2.5, 3.0]
      tolerance: [0.05, 0.08, 0.10]

  breakout_base:
    active:
      bullish:
        base_lookback: 20
        atr_tight_max: 1.5
        volume_mult: 1.5
        rr_target_mult: 2.0
      bearish:
        base_lookback: 20
        atr_tight_max: 1.5
        volume_mult: 1.5
        rr_target_mult: 2.0
    search:
      base_lookback: [15, 20, 30]
      atr_tight_max: [1.0, 1.5, 2.0]
      volume_mult: [1.1, 1.3, 1.5]
      rr_target_mult: [1.5, 2.0, 2.5, 3.0]

  ma_crossover:
    active:
      bullish:
        fast: 20
        slow: 50
        lookback: 10
      bearish:
        fast: 20
        slow: 50
        lookback: 10
    search:
      fast: [10, 20]
      slow: [50, 100]
      lookback: [5, 10]

  mean_reversion_rsi:
    active:
      bullish:
        rsi_period: 14
        rsi_oversold: 30
        trend_sma: 200
      bearish:
        rsi_period: 14
        rsi_oversold: 30
        trend_sma: 200
    search:
      rsi_period: [7, 14]
      rsi_oversold: [25, 30, 35]
      trend_sma: [100, 200]
