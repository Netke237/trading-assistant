# NOTE (2026-08-22, stock exit-targets rework): every `active:` value below was
# selected by the WFO tuner under the PREVIOUS exit formula, where target_price
# was a uniform `entry +/- risk * rr_target_mult` (or a fixed ATR multiple) for
# six of seven strategies. Targets are now strategy-specific (measured move,
# mid-band, prior swing extreme, VWAP, short-term mean), so `strategy_backtest`
# measures a different `tp=` and these values are no longer the tuner's answer to
# the current question. RE-RUNNING THE TUNER (Settings -> Strategy Tuning) IS AN
# EXPECTED, INTENDED CONSEQUENCE of that rework, not a symptom of a problem.
# Historical win rates and expectancies shown in step-6-backtest will also move
# (win rate up, average win down) for the same reason.
#
# Caveat: strategy_param_store.adopt() rewrites this file with yaml.safe_dump,
# which destroys every comment in it — including this one. The durable record is
# get_exit()'s docstring and
# docs/superpowers/plans/2026-08-22-stock-exit-targets-plan.md.

windows:
  type: rolling
  train_months: 12
  test_months: 3

costs:
  fee_pct: 0.001
  slippage_pct: 0.001

# bullish | bearish — controls which direction the backtest uses during WFO
direction: bullish

# Auto-evict finished jobs; keep the most recent max_completed (completed + failed)
job_retention:
  max_completed: 100

# Eligibility thresholds for WFO proposals
optimization:
  min_trades: 20
  min_consistency: 0.5
  min_symbols: 3

basket:
  per_sector: 5
  symbols: []

# Per-horizon tuner (STOCKS-HORIZON-T1 H8; strategy_param_store.get_tuning_config).
tuning:
  cost_per_leg: 0.0005
  stress_cost_per_leg: 0.002
  held_out_months: 12
  exit_buffer_days: 14
  windows:
    Swing:      {train_months: 12, test_months: 3}
    Position:   {train_months: 12, test_months: 3}
    Quarterly:  {train_months: 12, test_months: 4}
    SemiAnnual: {train_months: 16, test_months: 8}
    Annual:     {train_months: 24, test_months: 12}
  fire_rate_floor_per_day:
    Swing: 2.0
    Position: 1.0
    Quarterly: 0.6
    SemiAnnual: 0.4
    Annual: 0.2
  adoption: {ci_level: 0.95, min_oos_trades: 100, min_symbols: 20, bootstrap_resamples: 2000, seed: 7}
  min_train_trades: 30
  min_folds_not_thin: 4
  basket: {per_sector: 10}
  gates: {min_price: null, max_price: null}

strategies:
  pullback_ema:
    active:
      bullish:
        ema_period: 50
        trend_ema: 100
        atr_stop_mult: 1.5
        rr_target_mult: 2.0          # rungs 2-3 only; also in exit: so adopt() can't drop it
        tolerance: 0.04
        exit_swing_lookback: 20
      bearish:
        ema_period: 35
        trend_ema: 100
        atr_stop_mult: 1.5
        rr_target_mult: 2.0
        tolerance: 0.04
        exit_swing_lookback: 20
    exit:
      exit_swing_lookback: 20
      rr_target_mult: 2.0
      # Review fix #6 / D7: skip (never clamp) a signal whose first target is
      # under min_signal_rr R. The mechanism stays; it ships DISABLED (0.0) until
      # the Phase B multi-year re-tune (Kenneth, 2026-10-03): on the fixtures 1.0
      # made pullback_ema worse per trade (AAPL +0.08 -> -4.35 %, NVDA +0.415 ->
      # -2.34 %, SPY -0.52 -> -3.78 %, n <= 11). Set > 0 to re-enable. adopt()
      # drops YAML comments; the durable record is tests/test_pullback_min_rr.py
      # and decision D7 in docs/superpowers/plans/2026-10-03-trading-review-fixes-plan.md.
      min_signal_rr: 0.0
    search:
      # 35 is included alongside the original [20, 50] grid because
      # active.bearish.ema_period is deliberately hand-tuned to 35 — this
      # widening lets the WFO optimizer validate that live value against the
      # rest of the grid instead of it silently sitting outside search space.
      # See PLAN_TIER1_RISK_SAFETY.md #3.
      ema_period: [20, 35, 50]
      trend_ema: [100, 150, 200]
      atr_stop_mult: [1.0, 1.5, 2.0]
      # rr_target_mult REMOVED from the grid: it no longer influences
      # target_price (= ladder[0], now the prior swing extreme), and
      # strategy_backtest can only observe ladder[0]. Tuning it here would let
      # consensus() write a median of pure noise into active:.
      exit_swing_lookback: [10, 20, 30]
      tolerance: [0.02, 0.04, 0.06, 0.08]

    search_by_horizon:
      bullish:
        Swing:
          ema_period: [10, 20, 35]
          trend_ema: [50, 100]
          atr_stop_mult: [1.0, 1.5, 2.0]
          exit_swing_lookback: [10, 20]
          tolerance: [0.02, 0.04]
        Position:
          ema_period: [20, 35, 50]
          trend_ema: [100, 150, 200]
          atr_stop_mult: [1.5, 2.0, 2.5]
          exit_swing_lookback: [20, 30]
          tolerance: [0.03, 0.06]
        Quarterly:
          ema_period: [35, 50, 100]
          trend_ema: [150, 200]
          atr_stop_mult: [2.0, 2.5, 3.0]
          exit_swing_lookback: [30, 50]
          tolerance: [0.04, 0.08]
        SemiAnnual:
          ema_period: [50, 100]
          trend_ema: [150, 200]
          atr_stop_mult: [2.5, 3.0, 4.0]
          exit_swing_lookback: [50, 100]
          tolerance: [0.04, 0.08]
        Annual:
          ema_period: [50, 100, 150]
          trend_ema: [200]
          atr_stop_mult: [3.0, 4.0, 5.0]
          exit_swing_lookback: [100, 150]
          tolerance: [0.06, 0.1]
      bearish:
        Swing:
          ema_period: [10, 20, 35]
          trend_ema: [50, 100]
          atr_stop_mult: [1.0, 1.5, 2.0]
          exit_swing_lookback: [10, 20]
          tolerance: [0.02, 0.04]
        Position:
          ema_period: [20, 35, 50]
          trend_ema: [100, 150, 200]
          atr_stop_mult: [1.5, 2.0, 2.5]
          exit_swing_lookback: [20, 30]
          tolerance: [0.03, 0.06]
        Quarterly:
          ema_period: [35, 50, 100]
          trend_ema: [150, 200]
          atr_stop_mult: [2.0, 2.5, 3.0]
          exit_swing_lookback: [30, 50]
          tolerance: [0.04, 0.08]
        SemiAnnual:
          ema_period: [50, 100]
          trend_ema: [150, 200]
          atr_stop_mult: [2.5, 3.0, 4.0]
          exit_swing_lookback: [50, 100]
          tolerance: [0.04, 0.08]
        Annual:
          ema_period: [50, 100, 150]
          trend_ema: [200]
          atr_stop_mult: [3.0, 4.0, 5.0]
          exit_swing_lookback: [100, 150]
          tolerance: [0.06, 0.1]

  breakout_base:
    active:
      bullish:
        base_lookback: 20
        atr_tight_max: 4.0
        volume_mult: 1.5
        rr_target_mult: 2.0          # degenerate-case fallback only
        measured_move_mult: 1.0
      bearish:
        base_lookback: 20
        atr_tight_max: 4.0
        volume_mult: 1.5
        rr_target_mult: 2.0
        measured_move_mult: 1.0
    exit:
      measured_move_mult: 1.0
      rr_target_mult: 2.0
    search:
      base_lookback: [15, 20, 30]
      atr_tight_max: [3.0, 3.5, 4.0, 4.5]
      volume_mult: [1.1, 1.3, 1.5]
      # rr_target_mult REMOVED (see pullback_ema); replaced by the parameter
      # that actually sets rung 1. Same combo count as before.
      measured_move_mult: [0.75, 1.0, 1.25, 1.5]

    search_by_horizon:
      bullish:
        Swing:
          base_lookback: [10, 15, 20]
          atr_tight_max: [3.0, 3.5, 4.0, 4.5]
          volume_mult: [1.1, 1.3, 1.5]
          measured_move_mult: [0.5, 0.75, 1.0]
        Position:
          base_lookback: [15, 20, 30]
          atr_tight_max: [3.0, 3.5, 4.0, 4.5]
          volume_mult: [1.1, 1.3, 1.5]
          measured_move_mult: [0.75, 1.0, 1.5]
        Quarterly:
          base_lookback: [20, 30, 40]
          atr_tight_max: [3.5, 4.0, 4.5, 5.0]
          volume_mult: [1.1, 1.3, 1.5]
          measured_move_mult: [1.0, 1.5, 2.0]
        SemiAnnual:
          base_lookback: [30, 40, 60]
          atr_tight_max: [4.0, 4.5, 5.0]
          volume_mult: [1.1, 1.3]
          measured_move_mult: [1.5, 2.0, 3.0]
        Annual:
          base_lookback: [40, 60, 90]
          atr_tight_max: [4.0, 5.0, 6.0]
          volume_mult: [1.1, 1.3]
          measured_move_mult: [2.0, 3.0, 4.0]
      bearish:
        Swing:
          base_lookback: [10, 15, 20]
          atr_tight_max: [3.0, 3.5, 4.0, 4.5]
          volume_mult: [1.1, 1.3, 1.5]
          measured_move_mult: [0.5, 0.75, 1.0]
        Position:
          base_lookback: [15, 20, 30]
          atr_tight_max: [3.0, 3.5, 4.0, 4.5]
          volume_mult: [1.1, 1.3, 1.5]
          measured_move_mult: [0.75, 1.0, 1.5]
        Quarterly:
          base_lookback: [20, 30, 40]
          atr_tight_max: [3.5, 4.0, 4.5, 5.0]
          volume_mult: [1.1, 1.3, 1.5]
          measured_move_mult: [1.0, 1.5, 2.0]
        SemiAnnual:
          base_lookback: [30, 40, 60]
          atr_tight_max: [4.0, 4.5, 5.0]
          volume_mult: [1.1, 1.3]
          measured_move_mult: [1.5, 2.0, 3.0]
        Annual:
          base_lookback: [40, 60, 90]
          atr_tight_max: [4.0, 5.0, 6.0]
          volume_mult: [1.1, 1.3]
          measured_move_mult: [2.0, 3.0, 4.0]

  ma_crossover:
    active:
      bullish:
        fast: 20
        slow: 50
        lookback: 10
        atr_target_mult: 3.0
      bearish:
        fast: 20
        slow: 50
        lookback: 10
        atr_target_mult: 3.0
    exit:
      atr_target_mult: 3.0
    search:
      fast: [10, 20]
      slow: [50, 100]
      lookback: [5, 10]
      # Newly tunable: this multiple was hardcoded at 3.0 in the signal function
      # and does set rung 1, so the tuner can now see it.
      atr_target_mult: [2.0, 3.0, 4.0]

    search_by_horizon:
      bullish:
        Swing:
          fast: [5, 10, 20]
          slow: [30, 50]
          lookback: [3, 5, 10]
          atr_target_mult: [1.5, 2.0, 3.0]
        Position:
          fast: [10, 20, 30]
          slow: [50, 100, 150]
          lookback: [5, 10]
          atr_target_mult: [2.0, 3.0, 4.0]
        Quarterly:
          fast: [20, 30, 50]
          slow: [100, 150, 200]
          lookback: [5, 10, 20]
          atr_target_mult: [3.0, 4.0, 5.0]
        SemiAnnual:
          fast: [30, 50]
          slow: [150, 200]
          lookback: [10, 20]
          atr_target_mult: [4.0, 6.0, 8.0]
        Annual:
          fast: [50, 100]
          slow: [200, 300]
          lookback: [10, 20]
          atr_target_mult: [6.0, 8.0, 10.0]
      bearish:
        Swing:
          fast: [5, 10, 20]
          slow: [30, 50]
          lookback: [3, 5, 10]
          atr_target_mult: [1.5, 2.0, 3.0]
        Position:
          fast: [10, 20, 30]
          slow: [50, 100, 150]
          lookback: [5, 10]
          atr_target_mult: [2.0, 3.0, 4.0]
        Quarterly:
          fast: [20, 30, 50]
          slow: [100, 150, 200]
          lookback: [5, 10, 20]
          atr_target_mult: [3.0, 4.0, 5.0]
        SemiAnnual:
          fast: [30, 50]
          slow: [150, 200]
          lookback: [10, 20]
          atr_target_mult: [4.0, 6.0, 8.0]
        Annual:
          fast: [50, 100]
          slow: [200, 300]
          lookback: [10, 20]
          atr_target_mult: [6.0, 8.0, 10.0]

  mean_reversion_rsi:
    active:
      bullish:
        rsi_period: 14
        rsi_oversold: 30
        trend_sma: 200
        require_choppy_regime: false
        exit_sma_period: 20
        atr_target_mult: 2.5         # scales rung 2 only — not in the grid
      bearish:
        rsi_period: 14
        rsi_oversold: 30
        trend_sma: 200
        require_choppy_regime: false
        exit_sma_period: 20
        atr_target_mult: 2.5
    exit:
      exit_sma_period: 20
      atr_target_mult: 2.5
    search:
      rsi_period: [7, 14]
      rsi_oversold: [25, 30, 35]
      trend_sma: [100, 200]
      exit_sma_period: [10, 20]      # sets rung 1

    search_by_horizon:
      bullish:
        Swing:
          rsi_period: [2, 7, 14]
          rsi_oversold: [10, 20, 30, 35]
          trend_sma: [50, 100, 200]
          exit_sma_period: [5, 10, 20]
        Position:
          rsi_period: [7, 14, 21]
          rsi_oversold: [25, 30, 35, 40]
          trend_sma: [100, 200]
          exit_sma_period: [10, 20, 50]
        Quarterly:
          rsi_period: [14, 21]
          rsi_oversold: [30, 35, 40]
          trend_sma: [100, 200]
          exit_sma_period: [20, 50]
        SemiAnnual:
          rsi_period: [14, 21, 28]
          rsi_oversold: [30, 35, 40]
          trend_sma: [200]
          exit_sma_period: [50, 100]
        Annual:
          rsi_period: [14, 21, 28]
          rsi_oversold: [30, 35, 40]
          trend_sma: [200]
          exit_sma_period: [100, 150]
      bearish:
        Swing:
          rsi_period: [2, 7, 14]
          rsi_overbought: [90, 80, 70, 65]
          trend_sma: [50, 100, 200]
          exit_sma_period: [5, 10, 20]
        Position:
          rsi_period: [7, 14, 21]
          rsi_overbought: [75, 70, 65, 60]
          trend_sma: [100, 200]
          exit_sma_period: [10, 20, 50]
        Quarterly:
          rsi_period: [14, 21]
          rsi_overbought: [70, 65, 60]
          trend_sma: [100, 200]
          exit_sma_period: [20, 50]
        SemiAnnual:
          rsi_period: [14, 21, 28]
          rsi_overbought: [70, 65, 60]
          trend_sma: [200]
          exit_sma_period: [50, 100]
        Annual:
          rsi_period: [14, 21, 28]
          rsi_overbought: [70, 65, 60]
          trend_sma: [200]
          exit_sma_period: [100, 150]

  mean_reversion_bb:
    active:
      bullish:
        bb_period: 20
        bb_std: 2.0
        trend_sma: 200
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        require_choppy_regime: false
      bearish:
        bb_period: 20
        bb_std: 2.0
        trend_sma: 200
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        require_choppy_regime: false
    exit:
      rr_target_mult: 2.0
    search:
      bb_period: [15, 20, 25]
      bb_std: [1.5, 2.0, 2.5]
      trend_sma: [100, 200]
      stop_atr_mult: [0.2, 0.5, 1.0]
      # rr_target_mult REMOVED with NO replacement: rung 1 is the mid-band,
      # already fully determined by bb_period/bb_std, which are in the grid
      # above and now genuinely drive the exit as well as the entry.

    search_by_horizon:
      bullish:
        Swing:
          bb_period: [10, 15, 20]
          bb_std: [1.5, 2.0, 2.5]
          trend_sma: [50, 100, 200]
          stop_atr_mult: [0.5, 1.0]
        Position:
          bb_period: [20, 30]
          bb_std: [1.5, 2.0, 2.5]
          trend_sma: [100, 200]
          stop_atr_mult: [0.5, 1.0, 1.5]
        Quarterly:
          bb_period: [30, 50]
          bb_std: [2.0, 2.5]
          trend_sma: [100, 200]
          stop_atr_mult: [1.0, 1.5, 2.0]
        SemiAnnual:
          bb_period: [50, 100]
          bb_std: [2.0, 2.5]
          trend_sma: [200]
          stop_atr_mult: [1.5, 2.0, 3.0]
        Annual:
          bb_period: [100, 150]
          bb_std: [2.0, 2.5]
          trend_sma: [200]
          stop_atr_mult: [2.0, 3.0, 4.0]
      bearish:
        Swing:
          bb_period: [10, 15, 20]
          bb_std: [1.5, 2.0, 2.5]
          trend_sma: [50, 100, 200]
          stop_atr_mult: [0.5, 1.0]
        Position:
          bb_period: [20, 30]
          bb_std: [1.5, 2.0, 2.5]
          trend_sma: [100, 200]
          stop_atr_mult: [0.5, 1.0, 1.5]
        Quarterly:
          bb_period: [30, 50]
          bb_std: [2.0, 2.5]
          trend_sma: [100, 200]
          stop_atr_mult: [1.0, 1.5, 2.0]
        SemiAnnual:
          bb_period: [50, 100]
          bb_std: [2.0, 2.5]
          trend_sma: [200]
          stop_atr_mult: [1.5, 2.0, 3.0]
        Annual:
          bb_period: [100, 150]
          bb_std: [2.0, 2.5]
          trend_sma: [200]
          stop_atr_mult: [2.0, 3.0, 4.0]

  mean_reversion_vwap:
    active:
      bullish:
        vwap_dev_pct: 1.5
        reversal_pct: 0.3
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        interval: '15m'
        vwap_extension_atr: 0.5
      bearish:
        vwap_dev_pct: 1.5
        reversal_pct: 0.3
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        interval: '15m'
        vwap_extension_atr: 0.5
    exit:
      vwap_extension_atr: 0.5
      rr_target_mult: 2.0
    # no search block — excluded from WFO optimizer (intraday-only; no session boundary in daily OHLCV)

  mean_reversion_vwap_daily:
    # No active:/search: — this variant is only reachable through
    # mean_reversion_multi, which supplies vwap_lookback/vwap_deviation_pct from
    # the request. It gets an exit: block so its ladder is configurable.
    exit:
      rr_target_mult: 2.0

  mean_reversion_multi:
    # STOCKS-HORIZON-T1 H3: the multi params shape (today's frontend values).
    # Each variant's effective params = its exit: + its direction active: +
    # variant_params below + the request (merge_multi_params).
    active:
      bullish:
        variants: [mean_reversion_rsi, mean_reversion_bb, mean_reversion_vwap_daily]
        min_confirmations: 2
        variant_params:
          mean_reversion_vwap_daily:
            vwap_lookback: 20
            vwap_deviation_pct: 0.02
      bearish:
        variants: [mean_reversion_rsi, mean_reversion_bb, mean_reversion_vwap_daily]
        min_confirmations: 2
        variant_params:
          mean_reversion_vwap_daily:
            vwap_lookback: 20
            vwap_deviation_pct: 0.02
    exit: {}

    search_by_horizon:
      bullish:
        Swing:
          min_confirmations: [2, 3]
          mean_reversion_vwap_daily.vwap_lookback: [10, 20]
          mean_reversion_vwap_daily.vwap_deviation_pct: [0.01, 0.02, 0.03]
          mean_reversion_rsi.rsi_oversold: [25, 30, 35]
          mean_reversion_bb.bb_std: [1.5, 2.0, 2.5]
        Position:
          min_confirmations: [2, 3]
          mean_reversion_vwap_daily.vwap_lookback: [20, 50]
          mean_reversion_vwap_daily.vwap_deviation_pct: [0.02, 0.03, 0.05]
          mean_reversion_rsi.rsi_oversold: [30, 35]
          mean_reversion_bb.bb_std: [2.0, 2.5]
        Quarterly:
          min_confirmations: [2, 3]
          mean_reversion_vwap_daily.vwap_lookback: [50, 100]
          mean_reversion_vwap_daily.vwap_deviation_pct: [0.03, 0.05, 0.08]
          mean_reversion_rsi.rsi_oversold: [30, 35, 40]
          mean_reversion_bb.bb_std: [2.0, 2.5]
        SemiAnnual:
          min_confirmations: [2, 3]
          mean_reversion_vwap_daily.vwap_lookback: [50, 100]
          mean_reversion_vwap_daily.vwap_deviation_pct: [0.03, 0.05, 0.08]
          mean_reversion_rsi.rsi_oversold: [30, 35, 40]
          mean_reversion_bb.bb_std: [2.0, 2.5]
        Annual:
          min_confirmations: [2, 3]
          mean_reversion_vwap_daily.vwap_lookback: [50, 100]
          mean_reversion_vwap_daily.vwap_deviation_pct: [0.03, 0.05, 0.08]
          mean_reversion_rsi.rsi_oversold: [30, 35, 40]
          mean_reversion_bb.bb_std: [2.0, 2.5]
      bearish:
        Swing:
          min_confirmations: [2, 3]
          mean_reversion_vwap_daily.vwap_lookback: [10, 20]
          mean_reversion_vwap_daily.vwap_deviation_pct: [0.01, 0.02, 0.03]
          mean_reversion_rsi.rsi_overbought: [75, 70, 65]
          mean_reversion_bb.bb_std: [1.5, 2.0, 2.5]
        Position:
          min_confirmations: [2, 3]
          mean_reversion_vwap_daily.vwap_lookback: [20, 50]
          mean_reversion_vwap_daily.vwap_deviation_pct: [0.02, 0.03, 0.05]
          mean_reversion_rsi.rsi_overbought: [70, 65]
          mean_reversion_bb.bb_std: [2.0, 2.5]
        Quarterly:
          min_confirmations: [2, 3]
          mean_reversion_vwap_daily.vwap_lookback: [50, 100]
