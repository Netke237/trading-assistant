windows:
  type: rolling
  train_months: 12
  test_months: 3

costs:
  fee_pct: 0.001
  slippage_pct: 0.001

# bullish | bearish — controls which direction the backtest uses during WFO
direction: bullish

# Auto-evict finished jobs; keep the most recent max_completed (completed + failed)
job_retention:
  max_completed: 100

# Eligibility thresholds for WFO proposals
optimization:
  min_trades: 20
  min_consistency: 0.5

basket:
  per_sector: 5
  symbols: []

strategies:
  pullback_ema:
    active:
      bullish:
        ema_period: 50
        trend_ema: 100
        atr_stop_mult: 1.5
        rr_target_mult: 2.0
        tolerance: 0.04
      bearish:
        ema_period: 35
        trend_ema: 100
        atr_stop_mult: 1.5
        rr_target_mult: 2.0
        tolerance: 0.04
    search:
      # 35 is included alongside the original [20, 50] grid because
      # active.bearish.ema_period is deliberately hand-tuned to 35 — this
      # widening lets the WFO optimizer validate that live value against the
      # rest of the grid instead of it silently sitting outside search space.
      # See PLAN_TIER1_RISK_SAFETY.md #3.
      ema_period: [20, 35, 50]
      trend_ema: [100, 150, 200]
      atr_stop_mult: [1.0, 1.5, 2.0]
      rr_target_mult: [1.5, 2.0, 2.5, 3.0]
      tolerance: [0.02, 0.04, 0.06, 0.08]

  breakout_base:
    active:
      bullish:
        base_lookback: 20
        atr_tight_max: 1.5
        volume_mult: 1.5
        rr_target_mult: 2.0
      bearish:
        base_lookback: 20
        atr_tight_max: 1.5
        volume_mult: 1.5
        rr_target_mult: 2.0
    search:
      base_lookback: [15, 20, 30]
      atr_tight_max: [1.0, 1.5, 2.0]
      volume_mult: [1.1, 1.3, 1.5]
      rr_target_mult: [1.5, 2.0, 2.5, 3.0]

  ma_crossover:
    active:
      bullish:
        fast: 20
        slow: 50
        lookback: 10
      bearish:
        fast: 20
        slow: 50
        lookback: 10
    search:
      fast: [10, 20]
      slow: [50, 100]
      lookback: [5, 10]

  mean_reversion_rsi:
    active:
      bullish:
        rsi_period: 14
        rsi_oversold: 30
        trend_sma: 200
        require_choppy_regime: false
      bearish:
        rsi_period: 14
        rsi_oversold: 30
        trend_sma: 200
        require_choppy_regime: false
    search:
      rsi_period: [7, 14]
      rsi_oversold: [25, 30, 35]
      trend_sma: [100, 200]

  mean_reversion_bb:
    active:
      bullish:
        bb_period: 20
        bb_std: 2.0
        trend_sma: 200
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        require_choppy_regime: false
      bearish:
        bb_period: 20
        bb_std: 2.0
        trend_sma: 200
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        require_choppy_regime: false
    search:
      bb_period: [15, 20, 25]
      bb_std: [1.5, 2.0, 2.5]
      trend_sma: [100, 200]
      stop_atr_mult: [0.2, 0.5, 1.0]
      rr_target_mult: [1.5, 2.0, 2.5]

  mean_reversion_vwap:
    active:
      bullish:
        vwap_dev_pct: 1.5
        reversal_pct: 0.3
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        interval: '15m'
      bearish:
        vwap_dev_pct: 1.5
        reversal_pct: 0.3
        stop_atr_mult: 0.5
        rr_target_mult: 2.0
        interval: '15m'
    # no search block — excluded from WFO optimizer (intraday-only; no session boundary in daily OHLCV)

  breakout_setup:
    active:
      bullish:
        atr_compression_ratio: 0.85
        atr_avg_lookback: 20
        range_atr_mult: 3.0
        range_lookback_bars: 10
        vol_compression_ratio: 0.9
        resistance_proximity_pct: 0.08
        swing_lookback: 50
        require_trend: true
      bearish:
        atr_compression_ratio: 0.85
        atr_avg_lookback: 20
        range_atr_mult: 3.0
        range_lookback_bars: 10
        vol_compression_ratio: 0.9
        resistance_proximity_pct: 0.08
        swing_lookback: 50
        require_trend: true
    # no search block — SetupSignal has no entry/stop/target; cannot be backtested

composite_trigger:
  conviction_min: 60
  p_transition_min: 0.35
  p_stay_min: 0.70
  min_confirmations: 1
