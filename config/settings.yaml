app:
  name: "Options Screener"
  environment: "development"
  default_direction: "bullish"

scan:
  continuous_mode: false
  cadence_minutes: 30
  max_symbols: 150
  min_valid_stocks: 5
  shortlist_max_candidates: 10

risk:
  max_exposure_per_trade_pct: 10
  max_total_exposure_pct: 40
  max_concurrent_approved_trades: 6
  max_daily_recommendations: 20
  min_reward_risk_ratio: 1.5

alerts:
  enabled: true
  deduplication_minutes: 15
  event_risk_warning_days: 3

persistence:
  portfolio_state_file: "state/portfolio.json"
  watchlist_state_file: "state/watchlist.json"
  audit_log_file: "logs/audit.log"
